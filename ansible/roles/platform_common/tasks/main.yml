---
- name: Refresh apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common lab utilities
  ansible.builtin.apt:
    name:
      - curl
      - netcat-openbsd
      - python3
      - unzip
    state: present

- name: Add lab hostnames
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} WRI CYSEC LAB"
    block: |
      {{ lab_ip }} {{ inventory_hostname }}

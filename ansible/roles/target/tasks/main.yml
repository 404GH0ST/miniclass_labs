---
- name: Preseed the Postfix installation type
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: "Local only"
    vtype: select

- name: Preseed the Postfix mail name
  ansible.builtin.debconf:
    name: postfix
    question: postfix/mailname
    value: target.wri.local
    vtype: string

- name: Install target services
  ansible.builtin.apt:
    name:
      - bind9
      - nfs-kernel-server
      - openssh-server
      - postfix
      - rsync
      - samba
      - snmpd
      - vsftpd
    state: present

- name: Remove Dovecot so the enumerable mail lab owns ports 110 and 143
  ansible.builtin.apt:
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
    state: absent
    purge: true

- name: Stop the retired Week 4 HTTP application
  ansible.builtin.command:
    argv:
      - systemctl
      - disable
      - --now
      - training-app.service
  register: retired_http_service
  changed_when: retired_http_service.rc == 0
  failed_when: false

- name: Remove retired Week 4 HTTP application files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/training-app.service
    - /etc/wri-http-lab.env
    - /var/www/training-app

- name: Remove the retired Week 4 HTTP dependency
  ansible.builtin.apt:
    name: python3-flask
    state: absent
    purge: true

- name: Reload systemd after removing the Week 4 HTTP application
  ansible.builtin.systemd:
    daemon_reload: true

- name: Generate fresh random MD5 flags for this deployment
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import hashlib, json, os; print(json.dumps({name: hashlib.md5(os.urandom(32)).hexdigest() for name in ['ftp', 'ssh', 'smb', 'rsync', 'snmp', 'smtp', 'pop3', 'imap', 'dns_axfr', 'nfs']}))"
  register: deployment_flag_json
  changed_when: true
  no_log: true

- name: Parse the deployment-specific flags
  ansible.builtin.set_fact:
    deployment_flags: "{{ deployment_flag_json.stdout | from_json }}"
  no_log: true

- name: Store deployment flags for local services
  ansible.builtin.copy:
    content: |
      WRI_MAIL_HOST={{ lab_bind_ip }}
      WRI_POP3_FLAG=WRI{{ '{' }}{{ deployment_flags.pop3 }}{{ '}' }}
      WRI_IMAP_FLAG=WRI{{ '{' }}{{ deployment_flags.imap }}{{ '}' }}
    dest: /etc/wri-mail-lab.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart mail lab
  no_log: true

- name: Configure isolated anonymous FTP
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart vsftpd

- name: Create the anonymous FTP directory
  ansible.builtin.file:
    path: /srv/ftp/pub
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the Week 4 enumeration clue
  ansible.builtin.copy:
    content: |
      Training asset only. Record this flag in the evidence sheet.
      FTP enumeration flag: WRI{{ '{' }}{{ deployment_flags.ftp }}{{ '}' }}
    dest: /srv/ftp/pub/flag.txt
    owner: root
    group: root
    mode: "0644"

- name: Create the read-only SMB share
  ansible.builtin.file:
    path: /srv/samba/public
    state: directory
    owner: nobody
    group: nogroup
    mode: "0755"

- name: Add the SMB enumeration clue
  ansible.builtin.copy:
    content: |
      Guest-readable training share. Authentication testing is out of scope.
      SMB enumeration flag: WRI{{ '{' }}{{ deployment_flags.smb }}{{ '}' }}
    dest: /srv/samba/public/flag.txt
    owner: nobody
    group: nogroup
    mode: "0644"

- name: Configure isolated SMB
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/testparm -s %s
  notify: Restart smbd

- name: Create the read-only rsync module directory
  ansible.builtin.file:
    path: /srv/rsync/public
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the rsync enumeration flag
  ansible.builtin.copy:
    content: |
      Anonymous read-only rsync training module.
      Rsync enumeration flag: WRI{{ '{' }}{{ deployment_flags.rsync }}{{ '}' }}
    dest: /srv/rsync/public/flag.txt
    owner: root
    group: root
    mode: "0644"

- name: Configure the anonymous read-only rsync module
  ansible.builtin.template:
    src: rsyncd.conf.j2
    dest: /etc/rsyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsync lab

- name: Install the rsync lab service
  ansible.builtin.template:
    src: wri-rsync-lab.service.j2
    dest: /etc/systemd/system/wri-rsync-lab.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsync lab

- name: Configure isolated SNMP
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: /etc/snmp/snmpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart snmpd

- name: Configure the SSH enumeration banner
  ansible.builtin.template:
    src: ssh-lab.conf.j2
    dest: /etc/ssh/sshd_config.d/99-wri-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Configure isolated SMTP
  ansible.builtin.template:
    src: postfix-main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Restart postfix

- name: Create the mail-disclosed SSH training account
  ansible.builtin.user:
    name: operator
    password: "$6$wri-mail-ssh$iHyUCGqwkBmqkKOe3AbIuy/.I2W9bBsWzN0TsrAuoDy2z5BN3ilpvVO2Im0wPGuyhtwgsL29bpWogODGBPSoK1"
    shell: /bin/bash
    create_home: true
  no_log: true

- name: Deploy the intentionally enumerable POP3 and IMAP service
  ansible.builtin.copy:
    src: mail_lab.py
    dest: /opt/wri-mail-lab.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart mail lab

- name: Install the POP3 and IMAP lab service
  ansible.builtin.template:
    src: wri-mail-lab.service.j2
    dest: /etc/systemd/system/wri-mail-lab.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mail lab

- name: Configure isolated DNS options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Configure the training DNS zone
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Install the training DNS zone data
  ansible.builtin.template:
    src: db.wri.local.j2
    dest: /etc/bind/db.wri.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Install the training reverse DNS zone data
  ansible.builtin.template:
    src: db.192.168.56.j2
    dest: /etc/bind/db.192.168.56
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Create the read-only NFS export
  ansible.builtin.file:
    path: /srv/nfs/public
    state: directory
    owner: nobody
    group: nogroup
    mode: "0755"

- name: Add the NFS enumeration clue
  ansible.builtin.copy:
    content: |
      Read-only training export. Mount only from the participant workstation.
      NFS enumeration flag: WRI{{ '{' }}{{ deployment_flags.nfs }}{{ '}' }}
    dest: /srv/nfs/public/flag.txt
    owner: nobody
    group: nogroup
    mode: "0644"

- name: Remove superseded public flag filenames
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /srv/ftp/pub/readme.txt
    - /srv/samba/public/readme.txt
    - /srv/nfs/public/readme.txt

- name: Configure the NFS export
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

- name: Enable target services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - named
    - nfs-kernel-server
    - postfix
    - ssh
    - smbd
    - snmpd
    - vsftpd
    - wri-mail-lab
    - wri-rsync-lab

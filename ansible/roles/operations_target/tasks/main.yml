---
- name: Install the Week 7 shell dependency
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Create the designated application tree
  ansible.builtin.file:
    path: /var/www/training-app
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Plant the designated credential clue
  ansible.builtin.copy:
    content: |
      # Training data: discovery only; credential reuse is out of scope.
      APP_BACKUP_USER=backup-reader
      APP_BACKUP_PASSWORD=Semester1-Training-Only
    dest: /var/www/training-app/.env
    owner: vagrant
    group: vagrant
    mode: "0644"

- name: Enable SSH for the instructor-supplied shell
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

---
- name: Install Week 8 capstone dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - nodejs
      - npm
      - gcc
      - openssl
      - openssh-server
      - python3-flask
      - vsftpd
    state: present

- name: Check for an existing hidden staging virtual host label
  ansible.builtin.stat:
    path: /etc/wri-week8-staging-vhost
  register: staging_vhost_file

- name: Generate the hidden staging virtual host token
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -hex
      - "4"
  register: staging_vhost_token
  when: not staging_vhost_file.stat.exists
  no_log: true

- name: Persist the hidden staging virtual host label
  ansible.builtin.copy:
    content: "staging-{{ staging_vhost_token.stdout }}\n"
    dest: /etc/wri-week8-staging-vhost
    owner: root
    group: root
    mode: "0600"
  when: not staging_vhost_file.stat.exists
  no_log: true

- name: Read the hidden staging virtual host label
  ansible.builtin.slurp:
    src: /etc/wri-week8-staging-vhost
  register: staging_vhost_encoded
  no_log: true

- name: Set the hidden staging virtual host
  ansible.builtin.set_fact:
    staging_vhost: "{{ staging_vhost_encoded.content | b64decode | trim }}"
  no_log: true

- name: Stop previous Week 8 application services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - training-app
    - wri-week8-capstone
    - wri-week8-code-runner
    - wri-week8-staging
  failed_when: false
  changed_when: false

- name: Remove previous Week 8 application files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/training-app.service
    - /etc/systemd/system/wri-week8-capstone.service
    - /etc/systemd/system/wri-week8-code-runner.service
    - /etc/systemd/system/wri-week8-staging.service
    - /etc/wri-http-lab.env
    - /etc/wri-week8-capstone.env
    - /opt/wri-week8-capstone
    - /opt/wri-week8-code-runner
    - /opt/wri-week8-services/ci-console
    - /var/www/training-app
    - /srv/wri-week8-case
    - /home/vagrant/week8-supplied-shell.txt

- name: Create the Code Runner service account
  ansible.builtin.user:
    name: appsvc
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the Linux user reached through credential reuse
  ansible.builtin.user:
    name: caseworker
    password: "$6$wriweek8$wqQp/uV.pipm/DIRoHYpHKf1yVCJ9KwmNCsDQKV2rUaLMK/E2wHKyuoBSxloSIYFS4cFhQbTWWmfoJmvioNIp1"
    shell: /bin/bash
    create_home: true
  no_log: true

- name: Remove the superseded broad Week 8 SSH override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-week8-capstone.conf
    state: absent
  notify: Restart SSH

- name: Allow password authentication only for the credential-reuse account
  ansible.builtin.copy:
    content: |
      PermitRootLogin no
      Match User caseworker
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
    dest: /etc/ssh/sshd_config.d/00-week8-capstone.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

---
- name: Create the Rocket.Chat lab application directory
  ansible.builtin.file:
    path: /opt/wri-week8-chat
    state: directory
    owner: appsvc
    group: appsvc
    mode: "0755"

- name: Store Rocket.Chat lab credentials
  ansible.builtin.copy:
    content: |
      WRI_CHAT_USERNAME=ops.analyst
      WRI_CHAT_PASSWORD=Stream!Quartz-2026
      WRI_CHAT_SECRET=week8-rocketchat-lab-session-secret
      WRI_STAGING_VHOST={{ staging_vhost }}
    dest: /etc/wri-week8-chat.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart Week 8 chat portal
  no_log: true

- name: Deploy the Rocket.Chat lab portal
  ansible.builtin.copy:
    src: app.py
    dest: /opt/wri-week8-chat/app.py
    owner: appsvc
    group: appsvc
    mode: "0644"
  notify: Restart Week 8 chat portal

- name: Install the Rocket.Chat lab portal service
  ansible.builtin.template:
    src: wri-week8-chat.service.j2
    dest: /etc/systemd/system/wri-week8-chat.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Week 8 chat portal

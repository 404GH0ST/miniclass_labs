---
- name: Prepare Week 8 accounts and stable deployment state
  ansible.builtin.import_tasks: base.yml

- name: Configure the Week 8 chat portal
  ansible.builtin.import_tasks: chat.yml

- name: Configure the vulnerable MCPJam Inspector service
  ansible.builtin.import_tasks: inspector.yml

- name: Configure the anonymous FTP clue
  ansible.builtin.import_tasks: ftp.yml

- name: Configure the capstone virtual hosts

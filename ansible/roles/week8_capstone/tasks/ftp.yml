---
- name: Create the anonymous FTP content directory
  ansible.builtin.file:
    path: /srv/wri-week8-ftp/pub
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish the Rocket.Chat onboarding clue in anonymous FTP
  ansible.builtin.copy:
    content: |
      WRI Operations onboarding note
      ============================
      The operations team uses Rocket.Chat during the migration.

      URL: http://chat.wri.local
      Username: ops.analyst
      Password: Stream!Quartz-2026
    dest: /srv/wri-week8-ftp/pub/rocketchat-onboarding.txt
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Configure anonymous FTP for the capstone clue
  ansible.builtin.template:
    src: vsftpd-week8.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart vsftpd

---
- name: Enable the Rocket.Chat lab portal
  ansible.builtin.systemd:
    name: wri-week8-chat
    state: started
    enabled: true
    daemon_reload: true

- name: Enable the MCPJam Inspector service
  ansible.builtin.systemd:
    name: wri-week8-inspector
    state: started
    enabled: true
    daemon_reload: true

- name: Enable capstone web and FTP services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - nginx
    - ssh
    - vsftpd

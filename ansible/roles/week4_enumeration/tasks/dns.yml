---
- name: Configure isolated DNS options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Configure the training DNS zone
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Install the training DNS zone data
  ansible.builtin.template:
    src: db.wri.local.j2
    dest: /etc/bind/db.wri.local
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

- name: Install the training reverse DNS zone data
  ansible.builtin.template:
    src: db.192.168.56.j2
    dest: /etc/bind/db.192.168.56
    owner: root
    group: bind
    mode: "0644"
  notify: Restart named

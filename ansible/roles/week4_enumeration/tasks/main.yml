---
- name: Prepare Week 4 packages and remove retired services
  ansible.builtin.import_tasks: packages.yml

- name: Load stable deployment flags
  ansible.builtin.import_tasks: flags.yml

- name: Configure FTP enumeration
  ansible.builtin.import_tasks: ftp.yml

- name: Configure SMB enumeration
  ansible.builtin.import_tasks: smb.yml

- name: Configure rsync enumeration
  ansible.builtin.import_tasks: rsync.yml

- name: Configure SNMP and SSH enumeration
  ansible.builtin.import_tasks: snmp_ssh.yml

- name: Configure mail enumeration
  ansible.builtin.import_tasks: mail.yml

- name: Configure DNS enumeration
  ansible.builtin.import_tasks: dns.yml

- name: Configure NFS enumeration
  ansible.builtin.import_tasks: nfs.yml

- name: Start Week 4 services
  ansible.builtin.import_tasks: services.yml

---
- name: Install the training web application dependency
  ansible.builtin.apt:
    name: python3-flask
    state: present

- name: Generate a fresh HTTP enumeration flag
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import hashlib, os; print(hashlib.md5(os.urandom(32)).hexdigest())"
  register: http_flag_hash
  changed_when: true
  no_log: true

- name: Store the web-lab environment
  ansible.builtin.copy:
    content: |
      WRI_HTTP_FLAG=WRI{{ '{' }}{{ http_flag_hash.stdout }}{{ '}' }}
      WRI_LAB_PROFILE={{ lab_profile }}
    dest: /etc/wri-http-lab.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart training app
  no_log: true

- name: Create the training application directory
  ansible.builtin.file:
    path: /var/www/training-app/internal
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy the intentionally vulnerable training application
  ansible.builtin.copy:
    src: app.py
    dest: /var/www/training-app/app.py
    owner: www-data
    group: www-data
    mode: "0750"
  notify: Restart training app

- name: Install the training application service
  ansible.builtin.template:
    src: training-app.service.j2
    dest: /etc/systemd/system/training-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart training app

- name: Enable the training application
  ansible.builtin.systemd:
    name: training-app
    state: started
    enabled: true
    daemon_reload: true

- name: Install the Week 8 shell dependency
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Create the Week 8 designated application tree
  ansible.builtin.file:
    path: /var/www/training-app
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Plant the Week 8 credential clue
  ansible.builtin.copy:
    content: |
      # Training data: discovery only; credential reuse is out of scope.
      APP_BACKUP_USER=backup-reader
      APP_BACKUP_PASSWORD=Semester1-Training-Only
    dest: /var/www/training-app/.env
    owner: vagrant
    group: vagrant
    mode: "0644"

- name: Enable SSH for the Week 8 instructor-supplied shell
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

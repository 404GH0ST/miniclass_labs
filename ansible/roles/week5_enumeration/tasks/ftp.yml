---
- name: Configure isolated anonymous FTP
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart vsftpd

- name: Create the anonymous FTP directory
  ansible.builtin.file:
    path: /srv/ftp/pub
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the Week 5 FTP enumeration clue
  ansible.builtin.copy:
    content: |
      {% if lab_profile == 'week5_demo' %}
      Synthetic internal backup note for the instructor demo.
      {{ demo_disclosures.ftp }}
      {% else %}
      Training asset only. Record this flag in the evidence sheet.
      FTP enumeration flag: WRI{{ '{' }}{{ deployment_flags.ftp }}{{ '}' }}
      {% endif %}
    dest: "/srv/ftp/pub/{{ 'internal-notes.txt' if lab_profile == 'week5_demo' else 'flag.txt' }}"
    owner: root
    group: root
    mode: "0644"

- name: Remove the superseded FTP clue filename
  ansible.builtin.file:
    path: /srv/ftp/pub/readme.txt
    state: absent
